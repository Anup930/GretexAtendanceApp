<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Summary | Attendo Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Inter', sans-serif; } 
        /* Column Visibility Classes */
        .col-detail { display: none; }
        .col-detail.show { display: table-cell; }
        th.col-detail.show { background-color: #f9fafb; }
    </style>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden">

    <script>
        const currentUserStr = localStorage.getItem("currentUser");
        if (!currentUserStr) window.location.href = "index.html";
    </script>

    <aside class="w-64 bg-[#0f172a] text-gray-300 flex flex-col flex-shrink-0">
        <div class="h-16 flex items-center px-6 border-b border-gray-800 bg-[#0f172a]">
            <div class="flex items-center gap-2 text-white font-bold text-lg tracking-wide">
                <i class="ph-fill ph-squares-four text-blue-500 text-xl"></i><span>ATTENDO HUB</span>
            </div>
        </div>
        <nav class="flex-1 overflow-y-auto py-6 px-3 space-y-1">
             <a href="view.html" class="flex items-center gap-3 px-3 py-2.5 hover:bg-gray-800 hover:text-white rounded-lg transition"><i class="ph ph-house text-lg"></i><span class="font-medium">Dashboard</span></a>
            <a href="attendance.html" class="flex items-center gap-3 px-3 py-2.5 hover:bg-gray-800 hover:text-white rounded-lg transition"><i class="ph ph-table text-lg"></i><span class="font-medium">Attendance Report</span></a>
            <a href="Regularization.html" class="flex items-center gap-3 px-3 py-2.5 hover:bg-gray-800 hover:text-white rounded-lg transition"><i class="ph ph-check-circle text-lg"></i><span class="font-medium">Regularization</span></a>
            <a href="compoff.html" class="flex items-center gap-3 px-3 py-2.5 hover:bg-gray-800 hover:text-white rounded-lg transition"><i class="ph ph-calendar-plus text-lg"></i><span class="font-medium">Comp-Off</span></a>
            <a href="indivisual.html" class="flex items-center gap-3 px-3 py-2.5 hover:bg-gray-800 hover:text-white rounded-lg transition"><i class="ph ph-user text-lg"></i><span class="font-medium">Individual View</span></a>
            <a href="#" class="flex items-center gap-3 px-3 py-2.5 bg-blue-600 text-white rounded-lg shadow-md transition"><i class="ph ph-table text-lg"></i><span class="font-medium">Summary View</span></a>
            <a href="latelogin.html" class="flex items-center gap-3 px-3 py-2.5 hover:bg-gray-800 hover:text-white rounded-lg transition"><i class="ph ph-user text-lg"></i><span class="font-medium">Late Login</span></a>
        </nav>

        <div class="p-4 border-t border-gray-800 bg-[#0f172a]">
            <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center text-white font-bold" id="userAvatar">A</div>
                    <div>
                        <p class="text-sm font-bold text-white" id="sidebarUserName">Loading...</p>
                        <p class="text-xs text-gray-400" id="sidebarUserRole">...</p>
                    </div>
                </div>
                <button onclick="logout()" class="text-gray-400 hover:text-white" title="Sign Out">
                    <i class="ph ph-sign-out text-xl"></i>
                </button>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 shadow-sm flex-shrink-0">
            <h2 class="text-xl font-bold text-gray-800">Attendance Summary</h2>
            <div class="flex items-center gap-4">
                <label class="inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="toggleDetails" onchange="toggleView()" class="sr-only peer">
                    <div class="relative w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                    <span class="ms-3 text-sm font-medium text-gray-900">Show Detailed Breakdown</span>
                </label>
                <button onclick="window.location.reload()" class="p-2 hover:bg-gray-100 rounded-lg text-gray-600"><i class="ph ph-arrows-clockwise text-lg"></i></button>
            </div>
        </header>

        <div class="flex-1 overflow-hidden p-6">
            <div class="bg-white rounded-xl shadow border border-gray-200 flex flex-col h-full overflow-hidden">
                <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                    <div class="flex gap-4">
                        <select id="rowsPerPage" onchange="renderTable()" class="border p-2 rounded text-sm"><option value="10">10</option><option value="50">50</option><option value="all">All</option></select>
                        <input type="text" id="searchBox" onkeyup="handleSearch()" placeholder="Search Employee..." class="border p-2 rounded text-sm w-64">
                    </div>
                    <div class="text-sm text-gray-500" id="pageInfo">Loading...</div>
                </div>
                <div class="flex-1 overflow-auto">
                    <table class="w-full text-sm text-left text-gray-500">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-100 border-b sticky top-0 z-10">
                            <tr id="table-head">
                                </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-gray-200"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- PASTE YOUR API URL HERE ---
        const API_URL = "https://script.google.com/macros/s/AKfycbzLEoUcTpNNq-6FSs96HUVZsrqDBMVSVmgR1fcSvCD3OFHqxyz-X7aBVLveoC8_llPz/exec"; 

        let allHeaders = [];
        let allRows = [];
        let filteredRows = [];

        // --- Column Indices (Calculated Dynamically) ---
        let idxName = -1;
        let idxId = -1;
        let idxPayable = -1;
        let idxLeave = -1;

        function logout() {
            localStorage.removeItem("currentUser");
            window.location.href = "index.html";
        }

        async function init() {
            const user = JSON.parse(localStorage.getItem("currentUser"));
            if(user) {
                document.getElementById('sidebarUserName').innerText = user.name;
                document.getElementById('sidebarUserRole').innerText = user.role;
                document.getElementById('userAvatar').innerText = user.name.charAt(0).toUpperCase();
            }

            try {
                const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getSummaryViewData" }) });
                const json = await res.json();
                if(json.status === "success") {
                    allHeaders = json.headers;
                    allRows = json.rows;
                    filteredRows = allRows;
                    
                    // --- DYNAMICALLY FIND COLUMNS ---
                    const findIdx = (name) => allHeaders.findIndex(h => h.toString().trim() === name);

                    // 1. Find Static Columns
                    idxName = findIdx("Employee Name");
                    idxId = findIdx("Employee Id");
                    
                    // 2. Find Range (Start: Payable Days, End: Leave)
                    idxPayable = findIdx("Payable Days");
                    idxLeave = findIdx("Leave");

                    // Fallbacks if columns renamed
                    if(idxPayable === -1) idxPayable = 2; // Default to Col C
                    if(idxLeave === -1) idxLeave = 7;     // Default to Col H

                    renderTable();
                }
            } catch(e) { console.error(e); }
        }

        function handleSearch() {
            const q = document.getElementById('searchBox').value.toUpperCase();
            const searchIdx = idxName > -1 ? idxName : 1; 
            filteredRows = allRows.filter(row => row[searchIdx].toString().toUpperCase().includes(q));
            renderTable();
        }

        function toggleView() {
            const isChecked = document.getElementById('toggleDetails').checked;
            const detailCols = document.querySelectorAll('.col-detail');
            detailCols.forEach(col => {
                if(isChecked) col.classList.add('show');
                else col.classList.remove('show');
            });
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            const thead = document.getElementById('table-head');
            const showDetails = document.getElementById('toggleDetails').checked;
            
            if(allRows.length === 0) { tbody.innerHTML = `<tr><td class="p-4 text-center">Loading...</td></tr>`; return; }
            if(filteredRows.length === 0) { tbody.innerHTML = `<tr><td class="p-4 text-center">No results</td></tr>`; return; }

            // --- 1. BUILD HEADERS ---
            let htmlHead = ``;
            
            // A. Fixed: Name & ID Merged into "Employee"
            htmlHead += `<th class="px-4 py-3 border-r min-w-[250px] sticky left-0 bg-gray-100 z-20">Employee</th>`;

            // B. Default Range: From [Payable Days] to [Leave]
            for (let i = idxPayable; i <= idxLeave; i++) {
                let hName = allHeaders[i];
                let colorClass = "text-gray-700";
                
                if(hName === 'Payable Days') colorClass = "bg-blue-50 text-blue-700";
                else if(hName === 'Present') colorClass = "text-green-700";
                else if(hName === 'Absent') colorClass = "text-red-700";
                else if(hName === 'Leave') colorClass = "text-yellow-700";

                htmlHead += `<th class="px-4 py-3 border-r text-center ${colorClass}">${hName}</th>`;
            }

            // C. Breakdown Range: Everything AFTER [Leave]
            for (let i = idxLeave + 1; i < allHeaders.length; i++) {
                htmlHead += `<th class="px-4 py-3 border-r text-center col-detail ${showDetails?'show':''}">${allHeaders[i]}</th>`;
            }

            thead.innerHTML = htmlHead;

            // --- 2. BUILD ROWS ---
            const limit = document.getElementById('rowsPerPage').value === 'all' ? filteredRows.length : parseInt(document.getElementById('rowsPerPage').value);
            const items = filteredRows.slice(0, limit);

            tbody.innerHTML = items.map(row => {
                let id = (idxId > -1) ? row[idxId] : row[0];
                let name = (idxName > -1) ? row[idxName] : row[1];
                
                // MERGED NAME (ID) COLUMN
                let htmlRow = `
                    <td class="px-4 py-3 border-r font-medium text-blue-600 cursor-pointer sticky left-0 bg-white z-10" onclick="goToDetail('${id}')">
                        ${name} <span class="text-gray-500 text-xs font-normal">(${id})</span>
                    </td>
                `;

                // Default Range Values
                for (let i = idxPayable; i <= idxLeave; i++) {
                    let val = row[i];
                    let hName = allHeaders[i];
                    let style = "text-gray-800 font-bold";
                    if(hName === 'Payable Days') style = "bg-blue-50 text-blue-700 font-bold";
                    
                    htmlRow += `<td class="px-4 py-3 border-r text-center ${style}">${val}</td>`;
                }

                // Detailed Range Values
                for (let i = idxLeave + 1; i < row.length; i++) {
                    let val = row[i];
                    let valStyle = (val == 0 || val == '') ? "text-gray-300" : "font-bold text-gray-800";
                    htmlRow += `<td class="px-4 py-3 border-r text-center col-detail ${showDetails?'show':''}"><span class="${valStyle}">${val}</span></td>`;
                }

                return `<tr class="hover:bg-gray-50 border-b">${htmlRow}</tr>`;
            }).join('');
            
            document.getElementById('pageInfo').innerText = `Showing ${items.length} of ${filteredRows.length}`;
        }

        function goToDetail(id) {
            window.location.href = `indivisual.html?id=${id}`;
        }

        init();
    </script>
</body>
</html>
