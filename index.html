<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Attendance System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center font-sans">

    <div class="bg-white p-10 rounded-2xl shadow-xl w-full max-w-sm border border-gray-200">
        <div class="text-center mb-8">
            <div class="bg-blue-600 w-12 h-12 rounded-lg flex items-center justify-center mx-auto mb-4 shadow-lg">
                <i class="ph ph-lock-key text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">Welcome Back</h1>
            <p class="text-gray-500 text-sm mt-1">Enter your credentials to access the portal.</p>
        </div>

        <form onsubmit="handleLogin(event)">
            <div class="mb-5">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
                <div class="relative">
                    <input type="email" id="email" class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition" placeholder="you@company.com" required>
                    <i class="ph ph-envelope absolute left-3 top-3.5 text-gray-400 text-lg"></i>
                </div>
            </div>
            
            <div class="mb-6">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                <div class="relative">
                    <input type="password" id="password" class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition" placeholder="••••••••" required>
                    <i class="ph ph-lock absolute left-3 top-3.5 text-gray-400 text-lg"></i>
                </div>
            </div>

            <button type="submit" id="login-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-300 shadow-md flex justify-center items-center gap-2">
                <span>Sign In</span>
                <i class="ph ph-arrow-right"></i>
            </button>
            
            <div id="loading" class="hidden mt-3 text-center">
                <div class="inline-block w-5 h-5 border-2 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
            </div>

            <p id="error-msg" class="text-red-500 text-sm mt-4 text-center hidden bg-red-50 p-2 rounded border border-red-100"></p>
        </form>
    </div>

    <script>
        // CONFIGURATION
        // PASTE YOUR NEW DEPLOYED URL HERE
        const API_URL = "https://script.google.com/macros/s/AKfycbzLEoUcTpNNq-6FSs96HUVZsrqDBMVSVmgR1fcSvCD3OFHqxyz-X7aBVLveoC8_llPz/exec"; 

        async function handleLogin(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            const loader = document.getElementById('loading');
            const errorMsg = document.getElementById('error-msg');

            // UI State: Loading
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            btn.disabled = true;
            loader.classList.remove('hidden');
            errorMsg.classList.add('hidden');

            try {
                // Fetch API Call
                const response = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "login", email: email, password: password })
                });

                const result = await response.json();

                if (result.status === "success") {
                    // Save Session
                    localStorage.setItem("currentUser", JSON.stringify(result));
                    // Redirect to Dashboard
                    window.location.href = "view.html";
                } else {
                    throw new Error(result.message);
                }

            } catch (error) {
                // UI State: Error
                errorMsg.innerText = error.message || "Connection Failed";
                errorMsg.classList.remove('hidden');
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                btn.disabled = false;
                loader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
