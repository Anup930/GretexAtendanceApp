<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Approval | Attendo Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden">

    <script>
        const currentUserStr = localStorage.getItem("currentUser");
        if (!currentUserStr) window.location.href = "index.html";
    </script>

    <aside class="w-64 bg-[#0f172a] text-gray-300 flex flex-col flex-shrink-0">
        <div class="h-16 flex items-center px-6 border-b border-gray-800 bg-[#0f172a]">
            <div class="flex items-center gap-2 text-white font-bold text-lg tracking-wide">
                <i class="ph-fill ph-squares-four text-blue-500 text-xl"></i><span>ATTENDO HUB</span>
            </div>
        </div>
       <nav class="flex-1 overflow-y-auto py-6 px-3 space-y-1">
           <a href="view.html" class="flex items-center gap-3 px-3 py-2.5 hover:bg-gray-800 hover:text-white rounded-lg transition"><i class="ph ph-house text-lg"></i><span class="font-medium">Dashboard</span></a>
            <a href="attendance.html" class="flex items-center gap-3 px-3 py-2.5 hover:bg-gray-800 hover:text-white rounded-lg transition"><i class="ph ph-table text-lg"></i><span class="font-medium">Attendance Report</span></a>
            <a href="Regularization.html" class="flex items-center gap-3 px-3 py-2.5 text-white rounded-lg shadow-md transition"><i class="ph ph-check-circle text-lg"></i><span class="font-medium">Regularization</span></a>
            <a href="compoff.html" class="flex items-center gap-3 px-3 py-2.5 hover:bg-gray-800 hover:text-white rounded-lg transition"><i class="ph ph-calendar-plus text-lg"></i><span class="font-medium">Comp-Off</span></a>
            <a href="indivisual.html" class="flex items-center gap-3 px-3 py-2.5 hover:bg-gray-800 hover:text-white rounded-lg transition"><i class="ph ph-user text-lg"></i><span class="font-medium">Individual View</span></a>
            <a href="summary.html" class="flex items-center gap-3 px-3 py-2.5 hover:bg-gray-800 hover:text-white rounded-lg transition"><i class="ph ph-table text-lg"></i><span class="font-medium">Summary View</span></a>
            <a href="latelogin.html" class="flex items-center gap-3 px-3 py-2.5 hover:bg-gray-800 hover:text-white rounded-lg transition"><i class="ph ph-clock-countdown text-lg"></i><span class="font-medium">Late Login</span></a>
            <a href="salaryapproval.html" class="flex items-center gap-3 px-3 py-2.5 bg-blue-600 hover:bg-gray-800 hover:text-white rounded-lg transition"><i class="ph ph-currency-circle-dollar text-lg"></i><span class="font-medium">Salary Aproval</span></a>
        </nav>


        <div class="p-4 border-t border-gray-800 bg-[#0f172a]">
            <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center text-white font-bold" id="userAvatar">A</div>
                    <div>
                        <p class="text-sm font-bold text-white" id="sidebarUserName">Loading...</p>
                        <p class="text-xs text-gray-400" id="sidebarUserRole">...</p>
                    </div>
                </div>
                <button onclick="logout()" class="text-gray-400 hover:text-white" title="Sign Out"><i class="ph ph-sign-out text-xl"></i></button>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 shadow-sm flex-shrink-0">
            <h2 class="text-xl font-bold text-gray-800">Salary Approval</h2>
            <button onclick="window.location.reload()" class="p-2 hover:bg-gray-100 rounded-lg text-gray-600"><i class="ph ph-arrows-clockwise text-lg"></i></button>
        </header>

        <div class="flex-1 flex flex-col items-center justify-center bg-gray-50 text-center p-6">
            <div class="w-24 h-24 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-6 shadow-sm">
                <i class="ph-fill ph-hammer text-5xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-800 mb-3">Work in Progress</h1>
            <p class="text-gray-500 max-w-md text-lg">We are currently building the Salary Approval module. Check back soon!</p>
        </div>
    </main>

    <script>
        function logout() {
            localStorage.removeItem("currentUser");
            window.location.href = "index.html";
        }

        // Load User Info
        const user = JSON.parse(localStorage.getItem("currentUser"));
        if(user) {
            document.getElementById('sidebarUserName').innerText = user.name;
            document.getElementById('sidebarUserRole').innerText = user.role;
            document.getElementById('userAvatar').innerText = user.name.charAt(0).toUpperCase();
        }
    </script>
</body>
</html>
