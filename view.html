<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Attendo Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden">

    <script>
        const currentUserStr = localStorage.getItem("currentUser");
        if (!currentUserStr) {
            window.location.href = "index.html";
        }
    </script>

    <aside class="w-64 bg-[#0f172a] text-gray-300 flex flex-col flex-shrink-0">
        <div class="h-16 flex items-center px-6 border-b border-gray-800 bg-[#0f172a]">
            <div class="flex items-center gap-2 text-white font-bold text-lg tracking-wide">
                <i class="ph-fill ph-squares-four text-blue-500 text-xl"></i>
                <span>ATTENDO HUB</span>
            </div>
        </div>
        <nav class="flex-1 overflow-y-auto py-6 px-3 space-y-1">
             <a href="#" class="flex items-center gap-3 px-3 py-2.5 bg-blue-600 text-white rounded-lg shadow-md transition">
                <i class="ph ph-chart-pie-slice text-lg"></i>
                <span class="font-medium">Analytics</span>
            </a>
            <a href="attendance.html" class="flex items-center gap-3 px-3 py-2.5 hover:bg-gray-800 hover:text-white rounded-lg transition">
                <i class="ph ph-house text-lg"></i>
                <span class="font-medium">Attendance</span>
            </a>
            <a href="Regularization.html" class="flex items-center gap-3 px-3 py-2.5 hover:bg-gray-800 hover:text-white rounded-lg transition">
                <i class="ph ph-check-circle text-lg"></i><span class="font-medium">Regularization</span>
            </a>
            <a href="compoff.html" class="flex items-center gap-3 px-3 py-2.5 hover:bg-gray-800 hover:text-white rounded-lg transition">
                <i class="ph ph-calendar-plus text-lg"></i><span class="font-medium">Comp-Off</span>
            </a>
           <a href="indivisual.html" class="flex items-center gap-3 px-3 py-2.5 hover:bg-gray-800 hover:text-white rounded-lg transition"><i class="ph ph-user text-lg"></i><span class="font-medium">Individual View</span></a>
            <a href="summary.html" class="flex items-center gap-3 px-3 py-2.5 hover:bg-gray-800 hover:text-white rounded-lg transition"><i class="ph ph-table text-lg"></i><span class="font-medium">Summary View</span></a>
            <a href="latelogin.html" class="flex items-center gap-3 px-3 py-2.5 hover:bg-gray-800 hover:text-white rounded-lg transition"><i class="ph ph-user text-lg"></i><span class="font-medium">Late Login</span></a>
        </nav>

        <div class="p-4 border-t border-gray-800 bg-[#0f172a]">
            <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center text-white font-bold" id="userAvatar">A</div>
                    <div>
                        <p class="text-sm font-bold text-white" id="sidebarUserName">Loading...</p>
                        <p class="text-xs text-gray-400" id="sidebarUserRole">...</p>
                    </div>
                </div>
                <button onclick="logout()" class="text-gray-400 hover:text-white" title="Sign Out">
                    <i class="ph ph-sign-out text-xl"></i>
                </button>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 shadow-sm">
            <h2 class="text-xl font-bold text-gray-800">Company Overview</h2>
            <button onclick="window.location.reload()" class="p-2 hover:bg-gray-100 rounded-full">
                <i class="ph ph-arrows-clockwise text-xl"></i>
            </button>
        </header>

        <div class="flex-1 overflow-y-auto p-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex justify-between items-center">
                    <div>
                        <p class="text-sm font-medium text-gray-500">Total Unique Emp</p>
                        <h3 id="stat-total-emp" class="text-3xl font-bold text-gray-900 mt-1">...</h3>
                    </div>
                    <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center text-purple-600">
                        <i class="ph-fill ph-users-three text-2xl"></i>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex justify-between items-center">
                    <div>
                        <p class="text-sm font-medium text-gray-500">Pending Regularization</p>
                        <h3 id="stat-reg" class="text-3xl font-bold text-gray-900 mt-1">...</h3>
                    </div>
                    <div class="w-12 h-12 bg-orange-100 rounded-lg flex items-center justify-center text-orange-600">
                        <i class="ph-fill ph-warning-circle text-2xl"></i>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex justify-between items-center">
                    <div>
                        <p class="text-sm font-medium text-gray-500">Avg. Login Hours</p>
                        <h3 id="stat-avg-hours" class="text-3xl font-bold text-gray-900 mt-1">...</h3>
                    </div>
                    <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center text-blue-600">
                        <i class="ph-fill ph-timer text-2xl"></i>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">Day-wise Attendance Trends</h3>
                    <div class="relative h-72 w-full">
                        <canvas id="attendanceChart"></canvas>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">Today's Status</h3>
                    <div class="space-y-4">
                        <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
                            <span class="flex items-center gap-2 text-sm font-medium"><div class="w-3 h-3 bg-green-500 rounded-full"></div> Present</span>
                            <span class="font-bold text-gray-800" id="today-p">-</span>
                        </div>
                        <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
                            <span class="flex items-center gap-2 text-sm font-medium"><div class="w-3 h-3 bg-blue-500 rounded-full"></div> WFH / HD</span>
                            <span class="font-bold text-gray-800" id="today-wfh">-</span>
                        </div>
                        <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
                            <span class="flex items-center gap-2 text-sm font-medium"><div class="w-3 h-3 bg-red-500 rounded-full"></div> Leave / LWP</span>
                            <span class="font-bold text-gray-800" id="today-lwp">-</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // PASTE YOUR NEW DEPLOYED URL HERE
        const API_URL = "https://script.google.com/macros/s/AKfycbzLEoUcTpNNq-6FSs96HUVZsrqDBMVSVmgR1fcSvCD3OFHqxyz-X7aBVLveoC8_llPz/exec"; 

        window.onload = function() {
            // 1. Display User Info
            const user = JSON.parse(localStorage.getItem("currentUser"));
            if(user) {
                document.getElementById('sidebarUserName').innerText = user.name;
                document.getElementById('sidebarUserRole').innerText = user.role;
                document.getElementById('userAvatar').innerText = user.name.charAt(0).toUpperCase();
            }

            // 2. Load Data
            initDashboard();
        };

        function logout() {
            localStorage.removeItem("currentUser");
            window.location.href = "index.html";
        }

        async function initDashboard() {
            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "getDashboardData" })
                });
                const result = await response.json();
                
                if (result.status === "success") {
                    const data = result.data;
                    document.getElementById("stat-total-emp").innerText = data.totalEmp;
                    document.getElementById("stat-reg").innerText = data.totalReg;
                    document.getElementById("stat-avg-hours").innerText = data.avgHours + "h";
                    renderChart(data.chart);

                    const lastIdx = data.chart.labels.length - 1;
                    document.getElementById("today-p").innerText = data.chart.datasets[0].data[lastIdx] || 0;
                    document.getElementById("today-wfh").innerText = data.chart.datasets[1].data[lastIdx] || 0;
                    document.getElementById("today-lwp").innerText = data.chart.datasets[2].data[lastIdx] || 0;
                }
            } catch (error) {
                console.error("Error loading dashboard:", error);
            }
        }

        function renderChart(chartData) {
            const ctx = document.getElementById('attendanceChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: chartData.labels,
                    datasets: [
                        { label: 'Present', data: chartData.datasets[0].data, backgroundColor: '#22c55e', borderRadius: 4 },
                        { label: 'WFH / Remote', data: chartData.datasets[1].data, backgroundColor: '#3b82f6', borderRadius: 4 },
                        { label: 'Leave / Absent', data: chartData.datasets[2].data, backgroundColor: '#ef4444', borderRadius: 4 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true, grid: { color: '#f3f4f6' } }, x: { grid: { display: false } } },
                    plugins: { legend: { position: 'bottom' } }
                }
            });
        }
    </script>
</body>
</html>
